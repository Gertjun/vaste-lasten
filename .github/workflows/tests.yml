name: Tests

on:
  push:
    branches: [main, "fix/**", "feat/**", "claude/**"]
  pull_request:
    branches: [main]

jobs:
  sync-tests:
    name: Synchronisatietests
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node.js instellen
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: PWA-Core-modules controleren
        run: |
          for file in js/core/*.js js/vastelasten-core.js js/bundle-biometric.js js/conflict-review.js; do node --experimental-default-type=module --check "$file"; done
      - name: Inline app-JavaScript controleren
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start + 8);
          if (start < 0 || end < 0 || html.indexOf('<script>', start + 8) !== -1) throw new Error('Verwacht precies één inline app-script.');
          fs.writeFileSync('/tmp/vaste-lasten-app.js', html.slice(start + 8, end));
          NODE
          node --check /tmp/vaste-lasten-app.js
      - name: Release-pin controleren
        run: node tools/pin.mjs verify
      - name: Service-worker-precache controleren
        run: node tools/precache.mjs --manifest core-manifest.json --service-worker sw.js
      - name: Tests uitvoeren
        run: node --test tests/*.test.mjs

  ui-tests:
    name: UI-tests (Playwright)
    # vast op 24.04: Playwright ondersteunt nieuwere Ubuntu-versies nog niet altijd
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Repository ophalen
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python instellen
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Playwright en Chromium installeren
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: UI-tests uitvoeren
        run: python tests/ui/alle_tests.py -j 4 2>&1 | tee tests/ui/uitvoer.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Testrapport bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-testrapport
          path: |
            tests/ui/uitvoer.txt
            tests/ui/screens
          retention-days: 14
