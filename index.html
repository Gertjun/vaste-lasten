<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaste Lasten</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d6570">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vaste Lasten">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: één kolom als kasboekje, sticky maandkop, samenvatting bovenaan, tabbladen eronder */
:root{
  --bg:#eaeff2; --surface:#ffffff; --sunken:#f3f6f8; --ink:#15212a; --muted:#5a6a76; --line:#d3dce2;
  --accent:#0d6570; --accent-ink:#ffffff; --accent-soft:#d9ecee;
  --ok:#2c7a4b; --ok-soft:#dcefe3; --warn:#a25f00; --warn-soft:#f7e8d0; --bad:#b0322a;
  --c1:#0d6570; --c2:#7a4fc4; --c3:#c27a12; --c4:#2f7fc1; --c5:#b0432f; --c6:#6b7d3a; --c7:#7d8a94;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#162027; --sunken:#121a20; --ink:#e4ebef; --muted:#94a3ad; --line:#26333c;
  --accent:#4cb0bb; --accent-ink:#06262a; --accent-soft:#163a3f;
  --ok:#5cc58a; --ok-soft:#173527; --warn:#e7a54a; --warn-soft:#3a2b14; --bad:#ef7a70;
  --c1:#4cb0bb; --c2:#a888e6; --c3:#e0a243; --c4:#6eaee6; --c5:#e47f6a; --c6:#a3b86a; --c7:#9aa7b0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#162027; --sunken:#121a20; --ink:#e4ebef; --muted:#94a3ad; --line:#26333c;
  --accent:#4cb0bb; --accent-ink:#06262a; --accent-soft:#163a3f;
  --ok:#5cc58a; --ok-soft:#173527; --warn:#e7a54a; --warn-soft:#3a2b14; --bad:#ef7a70;
  --c1:#4cb0bb; --c2:#a888e6; --c3:#e0a243; --c4:#6eaee6; --c5:#e47f6a; --c6:#a3b86a; --c7:#9aa7b0;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:16px}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:34px;height:34px;border-radius:999px;font-size:18px;line-height:1}
.month button:hover{background:var(--sunken)}
.month span{min-width:128px;text-align:center;font-weight:600;text-transform:capitalize}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.sum-main{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,40px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum-grid div{background:var(--sunken);border-radius:9px;padding:10px 12px;min-width:0}
.sum-grid .num{display:block;font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar b{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.note{font-size:13px;color:var(--muted)}

.tabs{display:flex;gap:4px;margin:18px 0 12px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}

.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.row.paid{background:var(--sunken)}
.row.paid .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.day{width:44px;text-align:center;line-height:1.1;border-right:1px solid var(--line);padding-right:10px}
.day .num{font-size:20px;display:block}
.day small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.info{min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;letter-spacing:.02em}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ex{background:var(--accent-soft);color:var(--accent)}
.right{display:flex;align-items:center;gap:10px}
.amt{font-size:15px;text-align:right;white-space:nowrap}
.check{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.check svg{width:18px;height:18px;opacity:0}
.row.paid .check{background:var(--ok);border-color:var(--ok)}
.row.paid .check svg{opacity:1;stroke:var(--surface)}
.edit{border:0;background:none;padding:6px;border-radius:8px;color:var(--muted)}
.edit:hover{background:var(--sunken);color:var(--ink)}

.group h3{font-family:var(--f-display);font-size:15px;font-weight:600;margin:18px 0 8px;display:flex;justify-content:space-between;gap:8px;text-wrap:balance}
.group h3 .num{font-size:14px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}

.cats{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.cat-row .bar{grid-column:1/-1;height:10px}
.cat-row .bar b{transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stats .num{display:block;font-size:18px;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px;display:grid;gap:10px}
.panel h4{margin:0;font-family:var(--f-display);font-size:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:12px;background:var(--sunken);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}

.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);display:flex;gap:8px;align-items:center}

.scrim{position:fixed;inset:0;background:rgba(10,18,24,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(18px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0;font-family:var(--f-display);font-size:22px}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{font:inherit;color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-weight:500;max-width:calc(100% - 32px)}
@media (max-width:440px){.sum-grid{grid-template-columns:1fr 1fr}.sum-grid div:last-child{grid-column:1/-1}.month span{min-width:104px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><i aria-hidden="true">€</i>Vaste Lasten</div>
    <div class="month" role="group" aria-label="Maand kiezen">
      <button id="prev" aria-label="Vorige maand">‹</button>
      <span id="monthLabel">oktober 2026</span>
      <button id="next" aria-label="Volgende maand">›</button>
    </div>
  </header>

  <section class="summary" aria-live="polite">
    <div class="sum-main">
      <div><div class="lbl" id="dueLbl">Af te schrijven deze maand</div><div class="big" id="dueTotal">€ 0,00</div></div>
      <div class="note" id="countNote"></div>
    </div>
    <div class="bar" aria-hidden="true"><b id="paidBar" style="width:0%"></b></div>
    <div class="sum-grid">
      <div><span class="lbl">Betaald</span><span class="num" id="paidAmt">€ 0,00</span></div>
      <div><span class="lbl">Nog open</span><span class="num" id="openAmt">€ 0,00</span></div>
      <div><span class="lbl">Gem. per maand</span><span class="num" id="avgAmt">€ 0,00</span></div>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-maand" aria-selected="true" data-tab="maand">Deze maand</button>
    <button class="tab" role="tab" id="t-alle" aria-selected="false" data-tab="alle">Alle lasten</button>
    <button class="tab" role="tab" id="t-overzicht" aria-selected="false" data-tab="overzicht">Overzicht</button>
  </nav>

  <section id="v-maand"></section>
  <section id="v-alle" hidden></section>
  <section id="v-overzicht" hidden></section>
</div>

<button class="fab" id="addBtn"><span aria-hidden="true" style="font-size:20px;line-height:1">+</span>Nieuwe last</button>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="form" novalidate>
    <h2 id="formTitle">Nieuwe vaste last</h2>
    <div class="field"><label for="f-name">Omschrijving</label><input id="f-name" placeholder="Bijv. Hypotheek" autocomplete="off"></div>
    <div class="two">
      <div class="field"><label for="f-amount">Bedrag (€)</label><input id="f-amount" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
      <div class="field"><label for="f-cat">Categorie</label><select id="f-cat"></select></div>
    </div>
    <div class="two">
      <div class="field"><label for="f-freq">Hoe vaak</label>
        <select id="f-freq"><option value="m">Elke maand</option><option value="q">Per kwartaal</option><option value="y">Per jaar</option></select></div>
      <div class="field"><label for="f-day">Dag van afschrijving</label><input id="f-day" type="number" min="1" max="31" inputmode="numeric" value="1"></div>
    </div>
    <div class="field" id="monthField" hidden><label for="f-month">Eerste maand van afschrijving</label><select id="f-month"></select></div>
    <div class="field"><label for="f-note">Notitie (optioneel)</label><input id="f-note" placeholder="Bijv. polisnummer of looptijd" autocomplete="off"></div>
    <div class="err" id="formErr"></div>
    <div class="btns" style="justify-content:space-between">
      <button type="button" class="btn danger" id="delBtn" hidden>Verwijderen</button>
      <div class="btns" style="margin-left:auto">
        <button type="button" class="btn" id="cancelBtn">Annuleren</button>
        <button type="submit" class="btn primary">Opslaan</button>
      </div>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const KEY='vastelasten.v1';
const CATS=[
  {id:'wonen',name:'Wonen',c:'--c1'},
  {id:'verzekering',name:'Verzekeringen',c:'--c2'},
  {id:'energie',name:'Energie & water',c:'--c3'},
  {id:'abonnement',name:'Abonnementen',c:'--c4'},
  {id:'belasting',name:'Belastingen',c:'--c5'},
  {id:'vervoer',name:'Vervoer',c:'--c6'},
  {id:'overig',name:'Overig',c:'--c7'}];
const MONTHS=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const FREQ={m:'maandelijks',q:'per kwartaal',y:'jaarlijks'};
const eur=new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'});
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);

const EXAMPLES=[
  ['Hypotheek',1145,'wonen','m',1],['Zorgverzekering',152.35,'verzekering','m',1],
  ['Opstal- en inboedelverzekering',28.40,'verzekering','m',5],['Energie (termijnbedrag)',165,'energie','m',15],
  ['Water',22.10,'energie','m',15],['Internet & tv',58.50,'abonnement','m',20],
  ['Autoverzekering',61.20,'verzekering','m',25],['Gemeentelijke belastingen',78.25,'belasting','m',28],
  ['Motorrijtuigenbelasting',142,'belasting','q',10,1],['Doorlopende reisverzekering',39.50,'verzekering','y',12,3]
].map(([name,amount,cat,freq,day,month])=>({id:uid(),name,amount,cat,freq,day,month:month||1,note:'',example:true}));

function load(){
  try{const raw=localStorage.getItem(KEY); if(raw){const d=JSON.parse(raw); if(d&&Array.isArray(d.items)) return {items:d.items,paid:d.paid||{}};}}catch(e){}
  return {items:EXAMPLES,paid:{}};
}
let state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

const now=new Date();
let view={y:now.getFullYear(),m:now.getMonth()};
let tab='maand';
let editing=null;

const mkey=(y,m)=>y+'-'+String(m+1).padStart(2,'0');
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const monthly=i=>i.freq==='m'?i.amount:i.freq==='q'?i.amount/3:i.amount/12;
const occurs=(i,m)=>i.freq==='m'||(i.freq==='q'?(((m-(i.month-1))%3)+3)%3===0:m===i.month-1);
const cat=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>eur.format(n);

function due(){
  const dim=daysIn(view.y,view.m);
  return state.items.filter(i=>occurs(i,view.m)).map(i=>({...i,d:Math.min(i.day,dim)})).sort((a,b)=>a.d-b.d||a.name.localeCompare(b.name));
}
function paidSet(){return new Set(state.paid[mkey(view.y,view.m)]||[]);}

function render(){
  $('monthLabel').textContent=MONTHS[view.m]+' '+view.y;
  const list=due(), ps=paidSet();
  const total=list.reduce((s,i)=>s+i.amount,0);
  const paid=list.filter(i=>ps.has(i.id)).reduce((s,i)=>s+i.amount,0);
  const avg=state.items.reduce((s,i)=>s+monthly(i),0);
  $('dueTotal').textContent=fmt(total);
  $('paidAmt').textContent=fmt(paid);
  $('openAmt').textContent=fmt(total-paid);
  $('avgAmt').textContent=fmt(avg);
  $('paidBar').style.width=(total?paid/total*100:0)+'%';
  const nPaid=list.filter(i=>ps.has(i.id)).length;
  $('countNote').textContent=list.length?nPaid+' van '+list.length+' afgevinkt':'';
  renderMonth(list,ps); renderAll(); renderOverview(avg);
}

const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const PEN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';
const exChip=i=>i.example?'<span class="chip ex">Voorbeeld</span>':'';

function statusChip(i,paid){
  if(paid) return '<span class="chip ok">Betaald</span>';
  const t=new Date();
  if(view.y===t.getFullYear()&&view.m===t.getMonth()){
    const diff=i.d-t.getDate();
    if(diff<0) return '<span class="chip warn">Nog afvinken</span>';
    if(diff===0) return '<span class="chip warn">Vandaag</span>';
    if(diff<=3) return '<span class="chip warn">Over '+diff+(diff===1?' dag':' dagen')+'</span>';
  }
  return '';
}

function renderMonth(list,ps){
  const el=$('v-maand');
  if(!state.items.length){el.innerHTML='<div class="empty">Nog geen vaste lasten. Tik op <b>Nieuwe last</b> om je hypotheek, verzekeringen of abonnementen toe te voegen.</div>';return;}
  if(!list.length){el.innerHTML='<div class="empty">Geen afschrijvingen in '+MONTHS[view.m]+'.</div>';return;}
  el.innerHTML='<div class="list">'+list.map(i=>{
    const p=ps.has(i.id), c=cat(i.cat);
    return '<div class="row'+(p?' paid':'')+'">'+
      '<div class="day"><span class="num">'+i.d+'</span><small>'+MONTHS[view.m].slice(0,3)+'</small></div>'+
      '<div class="info"><div class="name">'+esc(i.name)+'</div><div class="meta"><span><span class="dot" style="background:var('+c.c+')"></span>'+c.name+'</span>'+(i.freq!=='m'?'<span>'+FREQ[i.freq]+'</span>':'')+statusChip(i,p)+exChip(i)+'</div></div>'+
      '<div class="right"><span class="amt num">'+fmt(i.amount)+'</span><button class="check" data-toggle="'+i.id+'" aria-pressed="'+p+'" aria-label="'+esc(i.name)+(p?' als niet betaald markeren':' als betaald markeren')+'">'+CHECK+'</button></div></div>';
  }).join('')+'</div>';
}

function renderAll(){
  const el=$('v-alle');
  if(!state.items.length){el.innerHTML='<div class="empty">Nog geen vaste lasten toegevoegd.</div>';return;}
  let html='';
  if(state.items.some(i=>i.example)) html+='<div class="panel" style="margin-top:0"><div class="note">De lijst is gevuld met voorbeeldbedragen zodat je ziet hoe het werkt. Pas ze aan of wis ze en begin met je eigen lasten.</div><div class="btns"><button class="btn" id="clearEx">Voorbeelden wissen</button></div></div>';
  CATS.forEach(c=>{
    const items=state.items.filter(i=>cat(i.cat).id===c.id).sort((a,b)=>monthly(b)-monthly(a));
    if(!items.length) return;
    const sum=items.reduce((s,i)=>s+monthly(i),0);
    html+='<div class="group"><h3><span><span class="dot" style="background:var('+c.c+')"></span>'+c.name+'</span><span class="num">'+fmt(sum)+' p/m</span></h3><div class="list">'+
      items.map(i=>'<div class="row" style="grid-template-columns:1fr auto">'+
        '<div class="info"><div class="name">'+esc(i.name)+'</div><div class="meta"><span>'+FREQ[i.freq]+(i.freq==='m'?' op de '+i.day+'e':' · vanaf '+MONTHS[i.month-1]+', dag '+i.day)+'</span>'+(i.note?'<span>'+esc(i.note)+'</span>':'')+exChip(i)+'</div></div>'+
        '<div class="right"><div style="text-align:right"><div class="amt num">'+fmt(i.amount)+'</div>'+(i.freq!=='m'?'<div class="note num" style="font-size:12px">≈ '+fmt(monthly(i))+' p/m</div>':'')+'</div><button class="edit" data-edit="'+i.id+'" aria-label="'+esc(i.name)+' bewerken">'+PEN+'</button></div></div>').join('')+
      '</div></div>';
  });
  el.innerHTML=html;
}

let installEvt=null;
function renderOverview(avg){
  const el=$('v-overzicht');
  const rows=CATS.map(c=>({c,sum:state.items.filter(i=>cat(i.cat).id===c.id).reduce((s,i)=>s+monthly(i),0)})).filter(r=>r.sum>0).sort((a,b)=>b.sum-a.sum);
  const max=rows.length?rows[0].sum:1;
  // jaaroverzicht: hoogste maand
  let peak={m:0,v:0};
  for(let m=0;m<12;m++){const v=state.items.filter(i=>occurs(i,m)).reduce((s,i)=>s+i.amount,0); if(v>peak.v) peak={m,v};}
  let html='<div class="stats"><div><span class="lbl">Per jaar</span><span class="num">'+fmt(avg*12)+'</span></div><div><span class="lbl">Duurste maand</span><span class="num">'+(peak.v?MONTHS[peak.m]+'</span><span class="note num">'+fmt(peak.v):'–')+'</span></div></div>';
  html+=rows.length?'<div class="cats">'+rows.map(r=>'<div class="cat-row"><span><span class="dot" style="background:var('+r.c.c+')"></span>'+r.c.name+'</span><span class="num">'+fmt(r.sum)+' <span class="note">('+Math.round(r.sum/avg*100)+'%)</span></span><div class="bar"><b style="width:'+(r.sum/max*100)+'%;background:var('+r.c.c+')"></b></div></div>').join('')+'<div class="note">Bedragen per kwartaal en per jaar zijn omgerekend naar een maandbedrag.</div></div>':'<div class="empty">Voeg lasten toe om de verdeling per categorie te zien.</div>';
  html+='<div class="panel"><h4>Back-up</h4><div class="note">Je gegevens staan alleen op dit apparaat. Maak af en toe een back-up, of zet je lasten over naar een ander apparaat door de back-up daar te plakken.</div>'+
    '<div class="btns"><button class="btn" id="copyBk">Kopieer back-up</button>'+(document.querySelector('link[rel="manifest"]')?'<button class="btn" id="dlBk">Download als bestand</button>':'')+'<label class="btn" for="fileBk" style="display:inline-block">Bestand terugzetten</label><input type="file" id="fileBk" accept="application/json,.json" hidden></div>'+
    '<textarea id="bkText" placeholder="Of plak hier een back-up en kies Terugzetten" aria-label="Back-up tekst"></textarea><div class="btns"><button class="btn" id="restoreBk">Terugzetten</button></div></div>';
  if(installEvt) html+='<div class="panel"><h4>Op je startscherm</h4><div class="note">Installeer Vaste Lasten als app, dan werkt hij ook offline.</div><div class="btns"><button class="btn primary" id="installBtn">Installeren</button></div></div>';
  el.innerHTML=html;
}

/* events */
document.querySelector('.tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return; tab=b.dataset.tab;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t===b));
  ['maand','alle','overzicht'].forEach(t=>$('v-'+t).hidden=t!==tab);
  try{localStorage.setItem(KEY+'.tab',tab);}catch(e){}
});
$('prev').onclick=()=>{view.m--; if(view.m<0){view.m=11;view.y--;} render();};
$('next').onclick=()=>{view.m++; if(view.m>11){view.m=0;view.y++;} render();};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-toggle]');
  if(t){const k=mkey(view.y,view.m), s=new Set(state.paid[k]||[]), id=t.dataset.toggle;
    s.has(id)?s.delete(id):s.add(id); state.paid[k]=[...s]; save(); render(); return;}
  const ed=e.target.closest('[data-edit]'); if(ed){openForm(state.items.find(i=>i.id===ed.dataset.edit)); return;}
  const id=e.target.id;
  if(id==='clearEx'){state.items=state.items.filter(i=>!i.example); save(); render(); toast('Voorbeelden gewist');}
  if(id==='copyBk'){const txt=JSON.stringify(state);
    const fb=()=>{$('bkText').value=txt;$('bkText').select();toast('Back-up staat in het tekstvak, kopieer hem daar');};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Back-up gekopieerd'),fb);}catch(err){fb();}}
  if(id==='dlBk'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
    a.download='vaste-lasten-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
    toast('Lukt downloaden niet? Gebruik Kopieer back-up');}
  if(id==='restoreBk') restore($('bkText').value);
  if(id==='installBtn'&&installEvt){installEvt.prompt();installEvt=null;}
});
document.addEventListener('change',e=>{
  if(e.target.id==='fileBk'&&e.target.files[0]){const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(e.target.files[0]);}
});
function restore(txt){
  try{const d=JSON.parse(txt); if(!d||!Array.isArray(d.items)) throw 0;
    state={items:d.items,paid:d.paid||{}}; save(); render(); toast('Back-up teruggezet: '+state.items.length+' lasten');}
  catch(e){toast('Dit is geen geldige back-up. Plak de volledige tekst die je eerder kopieerde.');}
}

/* form */
$('f-cat').innerHTML=CATS.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('');
$('f-month').innerHTML=MONTHS.map((m,i)=>'<option value="'+(i+1)+'">'+m+'</option>').join('');
$('f-freq').onchange=()=>{$('monthField').hidden=$('f-freq').value==='m';};
function openForm(item){
  editing=item||null;
  $('formTitle').textContent=item?'Vaste last bewerken':'Nieuwe vaste last';
  $('f-name').value=item?item.name:'';
  $('f-amount').value=item?String(item.amount.toFixed(2)).replace('.',','):'';
  $('f-cat').value=item?cat(item.cat).id:'wonen';
  $('f-freq').value=item?item.freq:'m';
  $('f-day').value=item?item.day:1;
  $('f-month').value=item?item.month:(view.m+1);
  $('f-note').value=item?item.note||'':'';
  $('monthField').hidden=$('f-freq').value==='m';
  $('delBtn').hidden=!item; $('delBtn').classList.remove('armed'); $('delBtn').textContent='Verwijderen';
  $('formErr').textContent='';
  $('scrim').hidden=false; setTimeout(()=>$('f-name').focus(),50);
}
function closeForm(){$('scrim').hidden=true; editing=null;}
function parseAmount(v){v=String(v).trim().replace(/[€\s]/g,''); if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.'); const n=parseFloat(v); return isFinite(n)?Math.round(n*100)/100:NaN;}
$('addBtn').onclick=()=>openForm(null);
$('cancelBtn').onclick=closeForm;
$('scrim').addEventListener('click',e=>{if(e.target===$('scrim')) closeForm();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('scrim').hidden) closeForm();});
$('delBtn').onclick=()=>{
  const b=$('delBtn');
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Zeker weten? Tik nogmaals';return;}
  state.items=state.items.filter(i=>i.id!==editing.id);
  Object.keys(state.paid).forEach(k=>state.paid[k]=state.paid[k].filter(x=>x!==editing.id));
  const n=editing.name; save(); closeForm(); render(); toast(n+' verwijderd');
};
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('f-name').value.trim(), amount=parseAmount($('f-amount').value), day=parseInt($('f-day').value,10);
  if(!name){$('formErr').textContent='Vul een omschrijving in, bijvoorbeeld "Hypotheek".';return;}
  if(!(amount>0)){$('formErr').textContent='Vul een bedrag groter dan 0 in, bijvoorbeeld 152,35.';return;}
  if(!(day>=1&&day<=31)){$('formErr').textContent='Kies een dag tussen 1 en 31.';return;}
  const data={name,amount,cat:$('f-cat').value,freq:$('f-freq').value,day,month:parseInt($('f-month').value,10)||1,note:$('f-note').value.trim(),example:false};
  const wasEdit=!!editing;
  if(editing){Object.assign(editing,data);} else state.items.push({id:uid(),...data});
  save(); closeForm(); render(); toast(wasEdit?'Opgeslagen':name+' toegevoegd');
});

let tt; function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600);}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;render();});
if(document.querySelector('link[rel="manifest"]')&&'serviceWorker' in navigator){
  try{navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){}
}

try{const t=localStorage.getItem(KEY+'.tab'); if(t&&$('t-'+t)) $('t-'+t).click();}catch(e){}
render();
})();
</script>

</body>
</html>
