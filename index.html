<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaste Lasten</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d6570">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vaste Lasten">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: één kolom als kasboekje, sticky maandkop, samenvatting bovenaan, tabbladen eronder */
:root{
  --bg:#eaeff2; --surface:#ffffff; --sunken:#f3f6f8; --ink:#15212a; --muted:#5a6a76; --line:#d3dce2;
  --accent:#0d6570; --accent-ink:#ffffff; --accent-soft:#d9ecee;
  --ok:#2c7a4b; --ok-soft:#dcefe3; --warn:#a25f00; --warn-soft:#f7e8d0; --bad:#b0322a;
  --c1:#0d6570; --c2:#7a4fc4; --c3:#c27a12; --c4:#2f7fc1; --c5:#b0432f; --c6:#6b7d3a; --c7:#7d8a94;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#162027; --sunken:#121a20; --ink:#e4ebef; --muted:#94a3ad; --line:#26333c;
  --accent:#4cb0bb; --accent-ink:#06262a; --accent-soft:#163a3f;
  --ok:#5cc58a; --ok-soft:#173527; --warn:#e7a54a; --warn-soft:#3a2b14; --bad:#ef7a70;
  --c1:#4cb0bb; --c2:#a888e6; --c3:#e0a243; --c4:#6eaee6; --c5:#e47f6a; --c6:#a3b86a; --c7:#9aa7b0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#162027; --sunken:#121a20; --ink:#e4ebef; --muted:#94a3ad; --line:#26333c;
  --accent:#4cb0bb; --accent-ink:#06262a; --accent-soft:#163a3f;
  --ok:#5cc58a; --ok-soft:#173527; --warn:#e7a54a; --warn-soft:#3a2b14; --bad:#ef7a70;
  --c1:#4cb0bb; --c2:#a888e6; --c3:#e0a243; --c4:#6eaee6; --c5:#e47f6a; --c6:#a3b86a; --c7:#9aa7b0;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:16px}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:34px;height:34px;border-radius:999px;font-size:18px;line-height:1}
.month button:hover{background:var(--sunken)}
.month span{min-width:128px;text-align:center;font-weight:600;text-transform:capitalize}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.sum-main{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,40px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum-grid div{background:var(--sunken);border-radius:9px;padding:10px 12px;min-width:0}
.sum-grid .num{display:block;font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar b{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.note{font-size:13px;color:var(--muted)}

.tabs{display:flex;gap:4px;margin:18px 0 12px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}

.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.row.paid{background:var(--sunken)}
.row.paid .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.day{width:44px;text-align:center;line-height:1.1;border-right:1px solid var(--line);padding-right:10px}
.day .num{font-size:20px;display:block}
.day small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.info{min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;letter-spacing:.02em}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ex{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.chip.samen{background:var(--accent-soft);color:var(--accent)}
.right{display:flex;align-items:center;gap:10px}
.amt{font-size:15px;text-align:right;white-space:nowrap}
.check{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.check svg{width:18px;height:18px;opacity:0}
.row.paid .check{background:var(--ok);border-color:var(--ok)}
.row.paid .check svg{opacity:1;stroke:var(--surface)}
.edit{border:0;background:none;padding:6px;border-radius:8px;color:var(--muted)}
.edit:hover{background:var(--sunken);color:var(--ink)}

.group h3{font-family:var(--f-display);font-size:15px;font-weight:600;margin:18px 0 8px;display:flex;justify-content:space-between;gap:8px;text-wrap:balance}
.group h3 .num{font-size:14px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}

.cats{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.cat-row .bar{grid-column:1/-1;height:10px}
.cat-row .bar b{transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stats .num{display:block;font-size:18px;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px;display:grid;gap:10px}
.panel h4{margin:0;font-family:var(--f-display);font-size:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:12px;background:var(--sunken);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}

.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);display:flex;gap:8px;align-items:center}

.scrim{position:fixed;inset:0;background:rgba(10,18,24,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(18px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0;font-family:var(--f-display);font-size:22px}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{font:inherit;color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.sync-pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync-pill[data-s="ok"]::before{background:var(--ok)}
.sync-pill[data-s="busy"]::before{background:var(--accent)}
.sync-pill[data-s="warn"]::before{background:var(--warn)}
.sync-pill[data-s="err"]::before{background:var(--bad)}
.panel .two{gap:10px}
.panel .ok-line{font-size:14px}
.panel code{font-family:var(--f-mono);font-size:13px;background:var(--sunken);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.field .seg label{text-align:center;padding:9px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.field .seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.field .seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--muted)}
.amt-wrap{text-align:right}
.sub{font-size:12px;color:var(--muted);white-space:nowrap}
.inleg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inleg div{background:var(--sunken);border-radius:9px;padding:10px 12px;min-width:0}
.inleg .num{display:block;font-size:18px;margin-top:2px}
.who{display:grid;gap:8px}
.who label{display:flex;align-items:center;gap:10px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-weight:500;max-width:calc(100% - 32px)}
@media (max-width:440px){.sum-grid{grid-template-columns:1fr 1fr}.sum-grid div:last-child{grid-column:1/-1}.month span{min-width:104px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><i aria-hidden="true">€</i>Vaste Lasten</div>
    <button class="sync-pill" id="syncPill" hidden data-s="ok">Gesynchroniseerd</button>
    <div class="month" role="group" aria-label="Maand kiezen">
      <button id="prev" aria-label="Vorige maand">‹</button>
      <span id="monthLabel">oktober 2026</span>
      <button id="next" aria-label="Volgende maand">›</button>
    </div>
  </header>

  <section class="summary" aria-live="polite">
    <div class="sum-main">
      <div><div class="lbl" id="dueLbl">Af te schrijven deze maand</div><div class="big" id="dueTotal">€ 0,00</div><div class="note num" id="myNote"></div></div>
      <div class="note" id="countNote"></div>
    </div>
    <div class="bar" aria-hidden="true"><b id="paidBar" style="width:0%"></b></div>
    <div class="sum-grid">
      <div><span class="lbl">Betaald</span><span class="num" id="paidAmt">€ 0,00</span></div>
      <div><span class="lbl">Nog open</span><span class="num" id="openAmt">€ 0,00</span></div>
      <div><span class="lbl">Jouw deel p/m</span><span class="num" id="avgAmt">€ 0,00</span></div>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-maand" aria-selected="true" data-tab="maand">Deze maand</button>
    <button class="tab" role="tab" id="t-alle" aria-selected="false" data-tab="alle">Alle lasten</button>
    <button class="tab" role="tab" id="t-overzicht" aria-selected="false" data-tab="overzicht">Overzicht</button>
  </nav>
  <div class="filters" id="filters" role="group" aria-label="Toon lasten">
    <button data-filter="alle" aria-pressed="true">Alles</button>
    <button data-filter="samen" aria-pressed="false">Gezamenlijk</button>
    <button data-filter="eigen" aria-pressed="false">Eigen</button>
  </div>

  <section id="v-maand"></section>
  <section id="v-alle" hidden></section>
  <section id="v-overzicht" hidden>
    <div id="ov-dyn"></div>
    <div class="panel" id="inlegPanel" hidden></div>
    <div class="panel" id="splitPanel"></div>
    <div class="panel" id="syncPanel"></div>
    <div class="panel">
      <h4>Back-up</h4>
      <div class="note">Een back-up bevat al je gegevens, onversleuteld. Bewaar hem op een veilige plek en nooit in een openbare repository.</div>
      <div class="btns"><button class="btn" id="copyBk">Kopieer back-up</button><button class="btn" id="dlBk" hidden>Download als bestand</button><label class="btn" for="fileBk" style="display:inline-block">Bestand terugzetten</label><input type="file" id="fileBk" accept="application/json,.json" hidden></div>
      <textarea id="bkText" placeholder="Of plak hier een back-up en kies Terugzetten" aria-label="Back-up tekst"></textarea>
      <div class="btns"><button class="btn" id="restoreBk">Terugzetten</button></div>
    </div>
    <div id="ov-install"></div>
  </section>
</div>

<button class="fab" id="addBtn"><span aria-hidden="true" style="font-size:20px;line-height:1">+</span>Nieuwe last</button>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="form" novalidate>
    <h2 id="formTitle">Nieuwe vaste last</h2>
    <div class="field"><span class="flabel" id="typeLbl">Soort</span>
      <div class="seg" role="radiogroup" aria-labelledby="typeLbl">
        <input type="radio" name="f-type" id="f-type-e" value="eigen" checked><label for="f-type-e">Eigen</label>
        <input type="radio" name="f-type" id="f-type-s" value="samen"><label for="f-type-s">Gezamenlijk</label>
      </div>
    </div>
    <div class="field"><label for="f-name">Omschrijving</label><input id="f-name" placeholder="Bijv. Hypotheek" autocomplete="off"></div>
    <div class="two">
      <div class="field"><label for="f-amount">Bedrag (€)</label><input id="f-amount" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
      <div class="field"><label for="f-cat">Categorie</label><select id="f-cat"></select></div>
    </div>
    <div class="two">
      <div class="field"><label for="f-freq">Hoe vaak</label>
        <select id="f-freq"><option value="m">Elke maand</option><option value="q">Per kwartaal</option><option value="y">Per jaar</option></select></div>
      <div class="field"><label for="f-day">Dag van afschrijving</label><input id="f-day" type="number" min="1" max="31" inputmode="numeric" value="1"></div>
    </div>
    <div class="field" id="splitField" hidden><label for="f-split">Jouw deel (%)</label><input id="f-split" type="number" min="0" max="100" inputmode="numeric"><span class="hint" id="splitHint"></span></div>
    <div class="field" id="monthField" hidden><label for="f-month">Eerste maand van afschrijving</label><select id="f-month"></select></div>
    <div class="field"><label for="f-note">Notitie (optioneel)</label><input id="f-note" placeholder="Bijv. polisnummer of looptijd" autocomplete="off"></div>
    <div class="err" id="formErr"></div>
    <div class="btns" style="justify-content:space-between">
      <button type="button" class="btn danger" id="delBtn" hidden>Verwijderen</button>
      <div class="btns" style="margin-left:auto">
        <button type="button" class="btn" id="cancelBtn">Annuleren</button>
        <button type="submit" class="btn primary">Opslaan</button>
      </div>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const BASE='vastelasten';
const DKEY=BASE+'.v2', OLDKEY=BASE+'.v1';
const CFGKEY=BASE+'.v2.sync', OLDCFG=BASE+'.v1.sync';
const UIKEY=BASE+'.ui';
const IS_PWA=!!document.querySelector('link[rel="manifest"]');
const CATS=[
  {id:'wonen',name:'Wonen',c:'--c1'},
  {id:'verzekering',name:'Verzekeringen',c:'--c2'},
  {id:'energie',name:'Energie & water',c:'--c3'},
  {id:'abonnement',name:'Abonnementen',c:'--c4'},
  {id:'belasting',name:'Belastingen',c:'--c5'},
  {id:'vervoer',name:'Vervoer',c:'--c6'},
  {id:'overig',name:'Overig',c:'--c7'}];
const MONTHS=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const FREQ={m:'maandelijks',q:'per kwartaal',y:'jaarlijks'};
const STORES=['samen','eigen'];
const eur=new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'});
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clampPct=v=>{v=Math.round(+v); return isFinite(v)?Math.min(100,Math.max(0,v)):50;};

/* ---------- voorbeelden ---------- */
const mk=(arr,prefix)=>arr.map(([name,amount,cat,freq,day,month],n)=>({id:prefix+n,name,amount,cat,freq,day,month:month||1,note:'',example:true,u:0,split:null}));
const EX_SAMEN=[['Hypotheek',1145,'wonen','m',1],['Opstal- en inboedelverzekering',28.40,'verzekering','m',5],['Energie (termijnbedrag)',165,'energie','m',15],
  ['Water',22.10,'energie','m',15],['Internet & tv',58.50,'abonnement','m',20],['Gemeentelijke belastingen',78.25,'belasting','m',28],['Doorlopende reisverzekering',39.50,'verzekering','y',12,3]];
const EX_EIGEN=[['Zorgverzekering',152.35,'verzekering','m',1],['Telefoonabonnement',18.50,'abonnement','m',8],['Autoverzekering',61.20,'verzekering','m',25],
  ['Sportschool',34.95,'abonnement','m',27],['Motorrijtuigenbelasting',142,'belasting','q',10,1]];

/* ---------- datamodel ----------
   state = {samen: Store, eigen: Store}
   Store = {items, del, paid, meta}
     items: [{id,name,amount,cat,freq,day,month,note,example,u,split}]
            u = laatst gewijzigd (ms); split = deel van persoon 1 in % (null = standaard)
     del:   {id: ms}               verwijderd of verplaatst
     paid:  {'2026-10': {id:{p,u}}}
     meta:  alleen in samen: {p1,p2,split,u}  namen en standaardverdeling   */
const EMPTY=()=>({items:[],del:{},paid:{},meta:null});
const DEFAULT_META={p1:'Ik',p2:'Partner',split:50,u:0};

function migStore(d){
  if(!d||!Array.isArray(d.items)) return null;
  const s=EMPTY();
  s.items=d.items.map(i=>({id:String(i.id),name:String(i.name||''),amount:+i.amount||0,cat:i.cat||'overig',freq:i.freq||'m',day:+i.day||1,month:+i.month||1,note:i.note||'',example:!!i.example,u:+i.u||0,
    split:(i.split==null||i.split==='')?null:clampPct(i.split)}));
  if(d.del&&typeof d.del==='object') for(const id in d.del) s.del[id]=+d.del[id]||0;
  const p=d.paid||{};
  for(const k in p){
    s.paid[k]={};
    if(Array.isArray(p[k])) p[k].forEach(id=>s.paid[k][id]={p:true,u:0});
    else for(const id in p[k]) s.paid[k][id]={p:!!p[k][id].p,u:+p[k][id].u||0};
  }
  if(d.meta&&typeof d.meta==='object') s.meta={p1:String(d.meta.p1||'Ik'),p2:String(d.meta.p2||'Partner'),split:clampPct(d.meta.split),u:+d.meta.u||0};
  return s;
}
function migrateAll(d){
  if(!d||typeof d!=='object') return null;
  if(d.samen||d.eigen) return {samen:migStore(d.samen)||EMPTY(),eigen:migStore(d.eigen)||EMPTY()};
  const e=migStore(d); // oude versie: alles was één lijst, wordt "eigen"
  return e?{samen:EMPTY(),eigen:e}:null;
}

  }
  return {samen:{...EMPTY(),items:mk(EX_SAMEN,'vbs')},eigen:{...EMPTY(),items:mk(EX_EIGEN,'vbe')}};
}

/* samenvoegen: per last, per vinkje en voor de verdeling wint de nieuwste wijziging */
function merge(a,b){
  const out=EMPTY();
  for(const s of [a,b]) for(const id in s.del) out.del[id]=Math.max(out.del[id]||0,s.del[id]);
  const map=new Map();
  for(const s of [a,b]) for(const i of s.items){const cur=map.get(i.id); if(!cur||i.u>cur.u) map.set(i.id,i);}
  for(const i of map.values()) if(!(out.del[i.id]>=i.u)) out.items.push({...i});
  for(const s of [a,b]) for(const k in s.paid){
    out.paid[k]=out.paid[k]||{};
    for(const id in s.paid[k]){const v=s.paid[k][id], cur=out.paid[k][id]; if(!cur||v.u>cur.u) out.paid[k][id]={p:v.p,u:v.u};}
  }
  const ma=a.meta, mb=b.meta;
  out.meta=!ma?(mb?{...mb}:null):!mb?{...ma}:(mb.u>ma.u?{...mb}:{...ma});
  return out;
}

function canon(v){
  if(Array.isArray(v)) return '['+v.map(canon).join(',')+']';
  if(v&&typeof v==='object') return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}

const ITER=310000;
const te=new TextEncoder(), td=new TextDecoder();
const fileOf=(st,c)=>st==='samen'?'samen.json':'eigen-'+(c||cfg).me+'.json';
let keys={samen:null,eigen:null};
let syncing=false, again=false, timer=null, lastSync=null, syncError='';
function saveCfg(){try{cfg?localStorage.setItem(CFGKEY,JSON.stringify(cfg)):localStorage.removeItem(CFGKEY);}catch(e){}}

function idb(mode,fn){return new Promise((res,rej)=>{
  try{const r=indexedDB.open('vaste-lasten',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onerror=()=>rej(r.error);
    r.onsuccess=()=>{const tx=r.result.transaction('kv',mode),st=tx.objectStore('kv'),q=fn(st);
      tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error);};
  }catch(e){rej(e);}});}
const keyGet=n=>idb('readonly',s=>s.get(n)).catch(()=>null);
const keySet=(n,k)=>idb('readwrite',s=>s.put(k,n)).catch(()=>null);
const keyDel=n=>idb('readwrite',s=>s.delete(n)).catch(()=>null);

function b64(bytes){let s='';const c=0x8000;for(let i=0;i<bytes.length;i+=c)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+c));return btoa(s);}
function unb64(str){const s=atob(str.replace(/\s/g,''));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}
const newSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
async function deriveKey(pass,saltB64){
  const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(saltB64),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(obj,key,saltB64){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj))));
  return {app:'vaste-lasten',v:2,kdf:{name:'PBKDF2',hash:'SHA-256',iter:ITER,salt:saltB64},alg:'AES-GCM',iv:b64(iv),ct:b64(ct)};
}
async function openEnv(env,key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},key,unb64(env.ct));
  return migStore(JSON.parse(td.decode(pt)))||EMPTY();
}

class SyncError extends Error{}
async function gh(method,path,body,c){
  let r;
  try{r=await fetch('https://api.github.com'+path,{method,cache:'no-store',headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});}
  catch(e){throw new SyncError(navigator.onLine?'GitHub is niet bereikbaar. Probeer het later opnieuw.':'offline');}
  if(r.status===401) throw new SyncError('De token is ongeldig of verlopen. Maak een nieuwe token aan en koppel opnieuw.');
  return r;
}
const cpath=(c,file)=>'/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+file;

async function readRemote(c,file){
  const r=await gh('GET',cpath(c,file),null,c);
  if(r.status===404) return {env:null,sha:undefined};
  if(r.status===403) throw new SyncError('De token heeft geen toegang tot deze repository. Controleer of hij leesrechten heeft op Contents.');
  if(!r.ok) throw new SyncError('GitHub gaf een foutmelding ('+r.status+').');
  const j=await r.json();
  let env; try{env=JSON.parse(atob(j.content.replace(/\s/g,'')));}catch(e){throw new SyncError('Het bestand '+file+' in de repository is beschadigd of niet door deze app gemaakt.');}
  if(!env||!env.kdf||!env.kdf.salt||!env.iv||!env.ct) throw new SyncError('Het bestand '+file+' in de repository is niet door deze app gemaakt.');
  return {env,sha:j.sha};
}
async function writeRemote(obj,sha,c,file,key,salt){
  const env=await seal(obj,key,salt);
  const r=await gh('PUT',cpath(c,file),{message:'Vaste lasten bijgewerkt',content:btoa(JSON.stringify(env)),...(sha?{sha}:{})},c);
  if(r.status===409||r.status===422) return null; // iemand anders was net eerder: opnieuw samenvoegen
  if(r.status===403||r.status===404) throw new SyncError('De token mag niet schrijven in deze repository. Geef hem schrijfrechten op Contents.');
  if(!r.ok) throw new SyncError('Opslaan in GitHub mislukte ('+r.status+').');
  return (await r.json()).content.sha;
}

function pillIdle(){
  if(!cfg) return setPill();
  if(!hasKeys()) return setPill('warn','Wachtwoord nodig','Tik om de synchronisatie te ontgrendelen');
  if(!navigator.onLine) return setPill('warn','Offline','Wijzigingen worden gesynchroniseerd zodra je weer online bent');
  setPill('ok','Gesynchroniseerd',lastSync?'Laatst: '+lastSync.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}):'');
}
function scheduleSync(){ if(!cfg||!hasKeys()) return; clearTimeout(timer); timer=setTimeout(sync,1200); }

async function syncStore(st){
  const file=fileOf(st);
  for(let attempt=0;attempt<4;attempt++){
    const {env,sha}=await readRemote(cfg,file);
    let remote=EMPTY();
    if(env){
      if(env.kdf.salt!==cfg.salt[st]) throw new SyncError('De '+(st==='samen'?'gezamenlijke':'eigen')+' gegevens in GitHub zijn met een ander wachtwoord versleuteld. Ontkoppel en koppel opnieuw.');
      try{remote=await openEnv(env,keys[st]);}catch(e){throw new SyncError('Ontsleutelen lukt niet. Ontkoppel en koppel opnieuw met het juiste wachtwoord.');}
    }
    const before=canonStore(state[st]);
    state[st]=merge(state[st],remote);
    if(canonStore(state[st])!==before){saveLocal(); render();}
    const up=withoutExamples(state[st]);
    if(env&&canonStore(up)===canonStore(remote)) return;
    if(await writeRemote(up,sha,cfg,file,keys[st],cfg.salt[st])) return;
  }
}
async function sync(){
  if(!cfg||!hasKeys()) return pillIdle();
  if(syncing){again=true;return;}
  if(!navigator.onLine) return pillIdle();
  syncing=true; setPill('busy','Synchroniseren…');
  try{
    for(const st of STORES) await syncStore(st);
    lastSync=new Date(); syncError=''; pillIdle(); renderSyncPanel();
  }catch(e){
    if(e.message==='offline') pillIdle();
    else{syncError=e.message; setPill('err','Sync-fout',e.message); renderSyncPanel();}
  }finally{
    syncing=false;
    if(again){again=false; scheduleSync();}
  }
}

const sErr=m=>{const e=$('s-err'); if(e) e.textContent=m==='offline'?'Je bent offline. Koppelen kan alleen met internet.':m;};
async function busy(id,label,fn){

  try{await fn();}catch(e){sErr(e.message||'Er ging iets mis.'); if(document.body.contains(b)){b.disabled=false;b.textContent=t;}}

function checkPw(a,b,what){
  if(a.length<8) throw new SyncError('Kies een '+what+' van minstens 8 tekens.');
  if(a!==b) throw new SyncError('De twee '+what+'en zijn niet gelijk.');
}

async function next1(){
  const owner=$('s-owner').value.trim().replace(/^@/,''), repo=$('s-repo').value.trim(), token=$('s-token').value.trim();
  if(!owner||!repo) throw new SyncError('Vul de gebruikersnaam van de eigenaar en de naam van de repository in.');
  if(!token) throw new SyncError('Plak de token die je op GitHub hebt aangemaakt.');
  const c={owner,repo,token};
  const r=await gh('GET','/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo),null,c);
  if(r.status===404||r.status===403) throw new SyncError('Repository '+owner+'/'+repo+' niet gevonden, of de token heeft er geen toegang toe.');
  if(!r.ok) throw new SyncError('GitHub gaf een foutmelding ('+r.status+').');
  if(!(await r.json()).private) throw new SyncError('Deze repository is openbaar. Gebruik een privé-repository voor je gegevens.');
  const {env}=await readRemote(c,'samen.json');
  lk={step:env?'join':'new',c,env};
  renderSyncPanel();
}
async function linkNew(){
  const n=$('n-me').value.trim(), p=$('n-partner').value.trim();
  if(!n||!p) throw new SyncError('Vul jouw naam en die van je partner in.');
  checkPw($('n-s1').value,$('n-s2').value,'gezamenlijk wachtwoord');
  checkPw($('n-e1').value,$('n-e2').value,'eigen wachtwoord');
  if($('n-s1').value===$('n-e1').value) throw new SyncError('Kies voor je eigen lasten een ander wachtwoord dan het gezamenlijke.');
  const c={...lk.c,me:'p1'};
  await finishLink(c,$('n-s1').value,$('n-e1').value,{p1:n,p2:p,split:meta().split,u:Date.now()});
}
async function next2(){
  const pass=$('j-s').value;
  if(!pass) throw new SyncError('Vul het gezamenlijke wachtwoord in.');
  const key=await deriveKey(pass,lk.env.kdf.salt);
  let remote; try{remote=await openEnv(lk.env,key);}catch(e){throw new SyncError('Dit gezamenlijke wachtwoord klopt niet.');}
  lk={...lk,step:'who',passS:pass,meta:remote.meta||DEFAULT_META,guess:oldCfg?'p1':'p2'};
  renderSyncPanel();
}
async function linkJoin(){
  const sel=document.querySelector('input[name="w-me"]:checked');
  if(!sel) throw new SyncError('Kies wie je bent.');
  checkPw($('w-e1').value,$('w-e2').value,'eigen wachtwoord');
  if($('w-e1').value===lk.passS) throw new SyncError('Kies voor je eigen lasten een ander wachtwoord dan het gezamenlijke.');
  await finishLink({...lk.c,me:sel.value},lk.passS,$('w-e1').value,null);
}
async function finishLink(c,passS,passE,newMeta){
  c.salt={}; const ks={};
  const next={samen:state.samen,eigen:state.eigen};
  const writes=[];
  for(const st of STORES){
    const file=fileOf(st,c), pass=st==='samen'?passS:passE;
    const {env,sha}=await readRemote(c,file);
    if(env){
      c.salt[st]=env.kdf.salt; ks[st]=await deriveKey(pass,c.salt[st]);
      let remote;
      try{remote=await openEnv(env,ks[st]);}
      catch(e){throw new SyncError(st==='samen'?'Het gezamenlijke wachtwoord klopt niet.':'Je eigen wachtwoord klopt niet met de gegevens die al in GitHub staan. Gebruik hetzelfde wachtwoord als op je andere apparaat.');}
      let local=next[st];
      if(remote.items.length) local={...local,items:local.items.filter(i=>!i.example)};
      next[st]=merge(local,remote);
      const up=withoutExamples(next[st]);
      if(canonStore(up)!==canonStore(remote)) writes.push([st,up,sha,file]);
    }else{
      c.salt[st]=newSalt(); ks[st]=await deriveKey(pass,c.salt[st]);
      if(st==='samen'&&newMeta) next.samen={...next.samen,meta:newMeta};
      writes.push([st,withoutExamples(next[st]),undefined,file]);
    }
  }
  for(const [st,up,sha,file] of writes) await writeRemote(up,sha,c,file,ks[st],c.salt[st]);
  state=next; saveLocal();
  cfg=c; keys=ks; saveCfg(); ui.me=c.me; saveUi();
  await keySet('kSamen',ks.samen); await keySet('kEigen',ks.eigen);
  if(oldCfg){try{localStorage.removeItem(OLDCFG);}catch(e){} keyDel('key'); oldCfg=null;}
  lk={step:1,c:null}; lastSync=new Date(); syncError='';
  render(); renderSplitPanel(); pillIdle(); renderSyncPanel();
  toast('Gekoppeld als '+nameOf(c.me));
}
async function unlock(){
  const ps=$('u-s').value, pe=$('u-e').value;
  if(!ps||!pe) throw new SyncError('Vul beide wachtwoorden in.');
  const ks={};
  for(const st of STORES){
    ks[st]=await deriveKey(st==='samen'?ps:pe,cfg.salt[st]);
    const {env}=await readRemote(cfg,fileOf(st));
    if(env){try{await openEnv(env,ks[st]);}catch(e){throw new SyncError((st==='samen'?'Het gezamenlijke':'Je eigen')+' wachtwoord klopt niet.');}}
  }
  keys=ks; await keySet('kSamen',ks.samen); await keySet('kEigen',ks.eigen);
  renderSyncPanel(); sync();
}
async function unlink(){
  cfg=null; keys={samen:null,eigen:null}; syncError=''; saveCfg(); await keyDel('kSamen'); await keyDel('kEigen');
  pillIdle(); renderSyncPanel(); renderSplitPanel(); toast('Ontkoppeld op dit apparaat');
}

function restore(txt){
  try{const s=migrateAll(JSON.parse(txt)); if(!s) throw 0;
    const t=Date.now(); let n=0;
    for(const st of STORES){
      s[st].items.forEach(i=>{i.u=t; i.example=false; n++;});
      const cur=state[st];
      state[st]=merge({items:[],del:cur.del,paid:cur.paid,meta:cur.meta},s[st]);
      state[st].items.forEach(i=>{delete state[st].del[i.id];});
    }
    save(); render(); toast('Back-up teruggezet: '+n+' lasten');}
  catch(e){toast('Dit is geen geldige back-up. Plak de volledige tekst die je eerder kopieerde.');}
}
